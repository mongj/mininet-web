name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild-guest: ${{ steps.guest.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          filter: blob:none
      - id: guest
        name: Check whether the guest image needs a rebuild
        run: |
          rebuild=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr_head=$(git rev-parse HEAD^2)
            base=$(git merge-base HEAD^1 "$pr_head")
            last_build=$(git log -1 --format=%H "$base..$pr_head" -- public/vm/guest.json)
            if ! git diff --quiet "${last_build:-$base}" "$pr_head" -- \
              guest ':!guest/packages.txt' ':!guest/kernel.config' \
              scripts/build-guest.sh scripts/package-guest.mjs; then
              rebuild=true
            fi
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

  guest:
    needs: changes
    if: needs.changes.outputs.rebuild-guest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      BRANCH: ${{ github.head_ref }}
      CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:guest
      - run: yarn prepare:assets
      - run: yarn test:vm
      - id: commit
        name: Commit the rebuilt guest
        run: |
          if [ "$CAN_PUSH" != true ]; then
            echo '::warning::The guest image is out of date. Rebuild it with yarn build:guest and commit the result.'
            exit 0
          fi
          git add public/vm guest/packages.txt guest/kernel.config public/pyright/mininet.json
          if git diff --cached --quiet; then
            echo 'The rebuilt guest matches the committed one.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(guest): rebuild the guest image'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

  verify:
    needs: guest
    if: ${{ !cancelled() && !failure() && needs.guest.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn verify
      - run: yarn test:vm
