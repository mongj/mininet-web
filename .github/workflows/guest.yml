name: Guest

on:
  pull_request:
    paths:
      - guest/Dockerfile
      - guest/init
      - guest/trim-modules.sh
      - guest/lab.py
      - guest/export-mininet-source.py
      - scripts/build-guest.sh
      - scripts/package-guest.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      CAN_PUSH: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:guest
      - run: yarn verify
      - run: yarn test:vm
      - name: Commit the rebuilt guest
        if: env.CAN_PUSH == 'true'
        run: |
          git add public/vm guest/packages.txt guest/kernel.config public/pyright/mininet.json
          if git diff --cached --quiet; then
            echo 'The rebuilt guest matches the committed one.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(guest): rebuild the guest image'
          git push origin "HEAD:refs/heads/$BRANCH"
