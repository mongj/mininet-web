name: Build guest

on:
  pull_request:
    paths:
      - guest/**
      - scripts/build-guest.sh
      - scripts/package-guest.mjs

permissions:
  contents: read

concurrency:
  group: build-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: check
        name: Check whether the guest changed since its last rebuild
        run: |
          pr_head=$(git rev-parse HEAD^2)
          base=$(git merge-base HEAD^1 "$pr_head")
          last_build=$(git log -1 --format=%H "$base..$pr_head" -- public/vm/guest.json)
          if git diff --quiet "${last_build:-$base}" "$pr_head" -- \
            guest ':!guest/packages.txt' ':!guest/kernel.config' \
            scripts/build-guest.sh scripts/package-guest.mjs; then
            echo 'rebuild=false' >> "$GITHUB_OUTPUT"
          else
            echo 'rebuild=true' >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.head_ref }}
      CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:guest
      - run: yarn prepare:assets
      - run: yarn test:vm
      - name: Commit the rebuilt guest
        run: |
          if [ "$CAN_PUSH" != true ]; then
            echo '::warning::The guest image is out of date. Rebuild it with yarn build:guest and commit the result.'
            exit 0
          fi
          git add public/vm guest/packages.txt guest/kernel.config public/pyright/mininet.json
          if git diff --cached --quiet; then
            echo 'The rebuilt guest matches the committed one.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(guest): rebuild the guest image'
          git push origin "HEAD:refs/heads/$BRANCH"
